[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
 "alembic>=1.14,<2", "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20",
 "pillow>=11,<13", "httpx>=0.28,<1", "keyring>=25,<27",
 "imageio-ffmpeg>=0.6,<1"
]

[project.optional-dependencies]
codex = ["openai-codex"]
dev = ["pytest>=8", "ruff>=0.11", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
